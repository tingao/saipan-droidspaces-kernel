# Saipan server tuning configuration.
# Sourced by service.sh / watchdog.sh. Edit here, then reboot (or wait up to 60s).
#
# NOTE: this file must use LF line endings. With CRLF, `echo "$CHARGE_UPPER"` writes "80\r"
# to sysfs and the qpnp_adaptive_charge driver rejects it, silently leaving the band
# disabled. If you edit this on Windows, save it as LF (or run dos2unix).

# ---- battery charge band ----------------------------------------------------
# Motorola's qpnp_adaptive_charge module exposes a charge band in
#   /sys/module/qpnp_adaptive_charge/parameters/{upper_limit,lower_limit}
#   upper_limit : stop charging at this percentage
#   lower_limit : resume charging at this percentage
#   -1 in either field disables the band (stock behaviour: always charge to 100%).
# Leaving a phone permanently at 100% on a charger is the fastest way to wear the
# cell; a 75-80% band keeps it near the flat part of the Li-ion voltage curve.
# NOTE: write order matters - writing upper_limit resets lower_limit to -1, so the
# scripts always write upper first, then lower.
# Set CHARGE_UPPER=-1 to restore stock behaviour.
#
# NOTE: charging is actually controlled by ACC (Advanced Charging Controller), the same
# KernelSU module the other two phone servers run. ACC drives the MTK charger interface
# (/proc/mtk_battery_cmd/en_power_path) and holds the pack in a 55-60% band. This qpnp band
# is deliberately set ABOVE ACC's, so it never engages during normal operation and only acts
# as a backstop if ACC stops: without it a failed accd would let the pack run to 100%.
CHARGE_UPPER=80
CHARGE_LOWER=75

# ---- keep-awake -------------------------------------------------------------
# On this SoC the Wi-Fi driver's suspend path is the classic failure mode: when the
# handset deep-suspends, the radio stops passing traffic and the phone drops off the
# network until something wakes the screen. Holding a kernel wakeup source
# (/sys/power/wake_lock) prevents suspend entirely.
#   always   : always hold the lock (max uptime, standby drain rises)
#   charging : hold only while on external power
#   off      : never hold it (stock behaviour)
AWAKEN_POLICY=charging

# ---- CPU clock --------------------------------------------------------------
# Cluster ceilings in kHz. These are the STOCK values for this handset's DVFS segment
# (efuse segment "FY"), so the mechanism is in place and changes nothing.
#
# Measured on-device with sysbench pinned to cpu6 (median of 3 x 10s runs), with the hardware
# PLL read from /proc/cpufreq/MT_CPU_DVFS_L/cpufreq_freq:
#   FY   (2,203,000): 927.9 events/s   PLL 2,202,000   Vproc 793,750 uV   <- stock
#   B20G (2,000,000): 841.2 events/s   PLL 1,999,000   Vproc 750,000 uV   <- -9.3%, real
#   B24G (2,400,000): 929.6 events/s   PLL 2,202,000   Vproc 837,500 uV   <- REJECTED
#     Under B24G the driver reports 2.4 GHz through cpufreq while its own DVFS interface
#     reports 2,202,000 kHz. The PLL never moves, throughput does not change, and the core
#     voltage goes up 43.75 mV for it. Not a loss - nothing, at a real cost.
#     See docs/CPU-CLOCK.md.
# The DVFS segment is selectable per-boot via the boot image cmdline
# (mtk_cpufreq.level=0 FY, 1 B20G, 2 B24G) - see v2-b20g.img / v2-b24g.img.
CPU_LITTLE_MIN=500000
CPU_LITTLE_MAX=2000000
CPU_BIG_MIN=725000
CPU_BIG_MAX=2203000
CPU_GOVERNOR=schedutil

# ---- Wi-Fi ------------------------------------------------------------------
# If the uplink is lost the watchdog re-enables Wi-Fi. Android sometimes leaves Wi-Fi
# disabled after a lock/suspend cycle.
WIFI_WATCHDOG=1

# ---- airplane mode ----------------------------------------------------------
# The cellular modem is powered whether or not it is useful, and on a handset that
# serves from a shelf that is pure cost. But whether it is idle or useful depends
# on the SIM, which can change while the phone is deployed - so the policy is
# decided from the device's own SIM state rather than hard-coded.
#   auto   : no SIM -> airplane mode ON (Wi-Fi kept alive); SIM -> airplane mode OFF
#   always : force airplane mode on, whatever the SIM says
#   never  : force it off
# Verified both directions on this handset: enabling airplane mode leaves Wi-Fi
# associated and reachable, and gsm.sim.state stays readable with the radio cut,
# which is what makes the check safe to evaluate in either state.
AIRPLANE_POLICY=auto

# How often the SIM/airplane policy is re-evaluated, counted in watchdog passes.
# The watchdog runs every 60 s, so 1 is the default and means every minute: a SIM
# inserted or removed is noticed within a minute, or two for removal, because the
# policy waits for a second ABSENT reading before it cuts the radio. Set it to
# 1440 for a once-a-day check. Nothing here is expensive either way - it is two
# property reads and, only when something needs to change, a settings write.
SIM_CHECK_EVERY=1